name: Release

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        project: [bluengo-prueba-jvs]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.5

      - name: Verify Go module
        run: |
          cd ${{ matrix.project }}
          go mod tidy
          go mod download

      - name: Build
        run: |
          OUTPUT_DIR=$GITHUB_WORKSPACE/bin/${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}
          mkdir -p $OUTPUT_DIR
          cd ${{ matrix.project }}
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o $OUTPUT_DIR/app main.go
          echo "Archivos generados:"
          ls -lah $OUTPUT_DIR

      - name: Zip executable
        run: |
          OUTPUT_DIR=$GITHUB_WORKSPACE/bin/${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}
          ZIP_NAME=app_${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          
          if [ ! -f "$OUTPUT_DIR/app" ]; then
            echo "Error: El binario no fue generado correctamente."
            exit 1
          fi

          cd $OUTPUT_DIR
          zip -j $GITHUB_WORKSPACE/bin/$ZIP_NAME app

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: app_${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          path: bin/app_${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh
          gh auth status || gh auth login --with-token <<< "${{ secrets.TOKEN_GITHUB }}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        with:
          tag_name: "1.1.0"
          release_name: "Release 1.1.0"
          body: "Release de ejecutables versión 1.1.0"
          draft: false
          prerelease: false

      - name: Upload individual release assets
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "Listando archivos ZIP a subir:"
          ls -lah artifacts

          for file in artifacts/*.zip; do
            echo "Subiendo $file..."
            gh release upload 1.1.0 "$file" --clobber
          done
