name: Release

on:
  push:
    branches:
    - develop

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        project: [bluengo-prueba-jvs] # Lista de tus proyectos

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.5

      - name: Build
        run: |
          cd ${{ matrix.project }}
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ../bin/${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}/app main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}_binaries
          path: bin/${{ matrix.project }}_${{ matrix.goos }}_${{ matrix.goarch }}/app

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "1.1.0"
          release_name: "Release 1.1.0"
          body: "Release de ejecutables versión 1.1.0"
          draft: false
          prerelease: false

      - name: Upload individual release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listando archivos ZIP a subir:"
          ls -lah artifacts
          for file in artifacts/*.zip; do
            echo "Subiendo $file..."
            gh release upload 1.1.0 "$file" --clobber
          done